name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match tag to VERSION
        run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Validate release commit subjects
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            ./scripts/check-commit-style.sh "$previous" "$GITHUB_REF_NAME"
          fi

  linux:
    name: Build Linux packages
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build AppImage and portable archive
        run: ./scripts/package-linux-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: colorful-linux-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*-portable.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Build Windows packages
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: |
            ~\Qt\6.8.3\msvc2022_64
            ~\colorful-deps
          key: windows-desktop-deps-v2-qt-6.8.3
          restore-keys: windows-desktop-deps-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-desktop-release
      - name: Install installer compiler
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Install provider dependencies
        shell: powershell
        run: bun install --cwd packages/provider-host --frozen-lockfile
      - name: Provision Qt and media dependencies
        shell: powershell
        run: .\scripts\provision-windows-qt.ps1
      - name: Build portable archive and installer
        shell: powershell
        run: .\scripts\package-windows.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: colorful-windows-${{ github.ref_name }}
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_message="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          if [[ -n "$release_message" ]]; then
            printf '%s\n\n' "$release_message" > release-notes.md
          else
            : > release-notes.md
          fi
          ./scripts/generate-release-notes.sh "$GITHUB_REF_NAME" >> release-notes.md

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "colorful $(cat VERSION)" \
              --notes-file release-notes.md
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              echo "Uploading $(basename "$asset") (attempt $attempt of 3)"
              if timeout 8m gh release upload "$tag" "$asset" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 5))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload $(basename "$asset") after 3 attempts" >&2
              exit 1
            fi
          done

          gh release edit "$tag" \
            --draft=false \
            --title "colorful $(cat VERSION)" \
            --notes-file release-notes.md
