name: Warm CI caches

# Keeps dependency caches warm so real builds rarely pay cold-cache costs
# (full Rust rebuilds, Qt/media downloads, Docker layer exports).
on:
  schedule:
    - cron: "17 3 * * *" # nightly, after GitHub's daily cache-maintenance window
  workflow_dispatch:

permissions:
  contents: read

env:
  COLORFUL_MPV_MODE: official

jobs:
  rust:
    name: Warm Rust test cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-tests
      - run: cargo test --workspace --locked

  windows:
    name: Warm Windows build caches
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: |
            ~\Qt\6.8.3\msvc2022_64
            ~\colorful-deps
          key: windows-desktop-deps-v3-qt-6.8.3-${{ hashFiles('packaging/desktop-dependencies.json') }}
          restore-keys: |
            windows-desktop-deps-v3-qt-6.8.3-
            windows-desktop-deps-v2-
            windows-desktop-deps-v1-
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-desktop-dev
      - name: Install provider dependencies
        shell: powershell
        run: bun install --cwd packages/provider-host --frozen-lockfile
      - name: Provision Qt and media dependencies
        shell: powershell
        run: .\scripts\provision-windows-qt.ps1
      - name: Warm Rust build cache
        shell: powershell
        run: cargo build --workspace --locked

  linux:
    name: Warm Linux Docker cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build cached Linux packaging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/Dockerfile
          load: true
          tags: colorful-linux-builder:ubuntu-22.04
          cache-from: type=gha,scope=colorful-linux-builder
          cache-to: type=gha,mode=max,scope=colorful-linux-builder
      - uses: actions/cache@v4
        with:
          path: |
            .cache/container/cargo
            .cache/container/target
            .cache/container/bun
            .cache/container/linuxdeploy
          key: linux-desktop-${{ hashFiles('Cargo.lock', 'packages/provider-host/bun.lock', 'packaging/desktop-dependencies.json', 'packaging/linux/Dockerfile', 'scripts/provision-linux-packaging.sh') }}
          restore-keys: |
            linux-desktop-
            linux-dev-
      - name: Warm Linux build cache
        env:
          COLORFUL_BUILD_CHANNEL: dev
          COLORFUL_BUILD_NUMBER: cache
          COLORFUL_SKIP_LINUX_BUILDER_BUILD: "1"
        run: ./scripts/package-linux-docker.sh
